# DNA đo được của kênh. Giải thích giọng ở style.md, căn cứ ở research/dna-2026-10.md. Chỉ đổi khi Sếp duyệt.
length_minutes: {target: 15, min: 10, max: 20}   # Sếp duyệt 2026-11-03 (lần 2): linh động theo lượng chất liệu, không lan man, không độn chữ
pace_note: "Giọng Thanh 214 âm tiết/phút, đo 2026-11-03"
min_facts: 55
promise_before_s: 35
subscribe: {position: end, max_s: 8}   # cuối video, trong phần kết (Sếp 2026-11-03)
curiosity_gap_s: [60, 120]
numbers_per_min: [0, 4]   # chỉ là trần (Sếp 2026-11-03)
steps: [5, 10]   # khuyến nghị, video ngắn ít bước hơn; mỗi bước khoảng 1,5-2,5 phút
# Chỉ cấm cụm mà nghĩa luôn là xưng hô sai, không dò từ đơn: "mình", "ta", "tập", "chặng" có nghĩa thường (một mình, người ta, tập trung, chặng đường), người chấm xét theo nghĩa (Sếp 2026-11-03)
banned_self_reference: ['theo tôi', 'tôi nghĩ', 'tôi sẽ', 'cùng tôi', 'chúng tôi sẽ', 'thám tử', 'nhà điều tra', '\bcác bạn\b', 'quý vị', 'anh em ơi', 'chào anh em']
watch_phrases: ["hãy cùng", "không chỉ", "đóng vai trò", "có thể nói rằng", "điều đáng nói", "thực tế là", "vô cùng", "cực kỳ", "đáng kinh ngạc", "thước phim", "hành trình kỳ diệu", "chưa có lời giải", "trong bối cảnh", "nhìn chung", "tóm lại", "một cách", "điều này có nghĩa", "tuy nhiên", "hơn nữa", "ngoài ra", "bật chuông", "nhớ like"]
sentence_warn_syllables: 35   # câu dài hơn thì lint nhắc, không phải lỗi
signature: "Bằng chứng vẫn còn đó."
