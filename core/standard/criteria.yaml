# Tiêu chí chung. gate: true là cổng bắt buộc, kênh không được bỏ. Tiêu chí riêng ở channels/<slug>/script/. check: lint (máy) hoặc critic (AI chấm độc lập).
- {id: fact-source, rule: "Mọi con số và sự thật có nguồn", check: critic, gate: true, area: script}
- {id: promise-match, rule: "Phần mở đầu giữ đúng lời hứa của tiêu đề và thumbnail", check: critic, gate: true, area: script}
- {id: hidden-answer, rule: "Hình đáp án không lộ trước câu trả lời", check: lint, gate: true, area: visual}
- {id: no-sticker, rule: "Cutout trong video không viền trắng", check: critic, gate: true, area: visual}
- {id: no-recon-tag, rule: "Không có thẻ Tái hiện", check: lint, gate: true, area: visual}
- {id: vn-islands, rule: "Bản đồ có Việt Nam phải có Hoàng Sa, Trường Sa", check: critic, gate: true, area: map}
- {id: photo-source, rule: "Tài liệu minh họa đúng nội dung, có nguồn ghi trong credits.json", check: critic, gate: true, area: visual}
- {id: chapters, rule: "Meta có mốc thời gian từng phần, mốc đầu 0:00", check: critic, gate: true, area: package}
- {id: thumb-hook, rule: "Thumbnail có hook gây tò mò, đủ nghĩa khi chỉ nhìn thumbnail, đọc được ở 160x90, không lặp tiêu đề, đúng sự thật", check: critic, gate: true, area: package}
- {id: ai-notice, rule: "Có dòng ghi chú AI ở cuối video", check: lint, gate: true, area: visual}
- {id: subscribe-in-story, rule: "Lời mời đăng ký sau câu hỏi lớn, trước bước đầu tiên, viết như lời dẫn", check: lint, gate: true, area: script}
- {id: no-roadmap, rule: "Không đọc lộ trình phần hay chương", check: critic, gate: true, area: script}
- {id: no-rival-copy, rule: "Không chép lời, số, tiêu đề đối thủ, không dịch từ kênh khác", check: critic, gate: true, area: script}
- {id: reference-floor, rule: "Video tham chiếu cùng ngách, ít nhất 100K view, ưu tiên từ 500K", check: critic, gate: true, area: research}
